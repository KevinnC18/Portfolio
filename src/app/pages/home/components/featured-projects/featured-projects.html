<section class="py-10 px-6 bg-background">
    <h2 class="text-3xl font-semibold tracking-tight text-center text-color-text sm:text-5xl mb-10">Proyectos 
        <span class="text-transparent bg-clip-text bg-linear-to-r from-secondary-light to-primary"> destacados </span> 
    </h2>
    <div class="w-48 h-1 bg-linear-to-r from-secondary to-primary mx-auto rounded-full m-10"></div>
    <div class="flex justify-center-safe gap-x-15 mt-10 flex-wrap gap-y-10">
        @for (project of projects; track project.title) {
        <div
            class="card bg-background-secondary w-96 rounded-lg hover:shadow-2xl hover:shadow-primary-hover/20 transition-all duration-300">
            <div class="card-body items-center">
                <h2 class="card-title">{{ project.title }}</h2>
                <p>{{ project.description }}</p>
                <div class="bg-background-secondary rounded-lg p-8">
                    <h3 class="text-xl font-semibold text-color-text mb-4 flex justify-center gap-2">
                        Tecnologías
                    </h3>
                    <ul class="space-y-3">
                        @for (tech of project.technologies; track tech) {
                        <li class="flex items-center gap-3 text-text-secondary">
                            <span class="w-2 h-2 bg-primary rounded-full"></span>
                            <span>{{ tech }}</span>
                        </li>
                        }
                    </ul>
                </div>
                <div class="card-actions">
                    <a [routerLink]="project.link" class="btn btn-primary hover:scale-105 transition-transform">
                        Ver proyecto
                    </a>
                </div>
            </div>
        </div>
        }
    </div>
</section>
